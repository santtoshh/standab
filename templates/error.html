<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standab · Error</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='standab-logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:        #1f2937;
      --ink-strong: #111827;
      --muted:      #6b7280;
      --line:       #e5e7eb;
      --line-soft:  #eef0f3;
      --bg:         #ffffff;
      --bg-soft:    #f8fafc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg-soft);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .nav {
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 24px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink-strong);
    }
    .brand img { height: 22px; }
    .brand-sub {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      padding-left: 12px;
      border-left: 1px solid var(--line);
    }

    .shell {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }
    .card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 24px 28px;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b91c1c;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: var(--ink-strong);
    }
    .sub {
      color: var(--muted);
      font-size: 13.5px;
      margin-bottom: 18px;
    }
    .sub code {
      background: var(--bg-soft);
      border: 1px solid var(--line);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11.5px;
      color: var(--ink-strong);
    }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px;
      border-radius: 8px;
      overflow: auto;
      font-size: 11.5px;
      line-height: 1.55;
      max-height: 48vh;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      margin: 0;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      padding: 8px 14px;
      background: var(--ink-strong);
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.12s;
    }
    .back:hover { background: #000; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="brand">
        <img src="{{ url_for('static', filename='standab-logo.png') }}" alt="Standab">
        <span class="brand-sub">Data Analysis Tool</span>
      </a>
    </div>
  </nav>
  <main class="shell">
    <div class="card">
      <div class="eyebrow">Error</div>
      <h1>Something went wrong</h1>
      <div class="sub">Job <code>{{ job_id }}</code> — {{ message }}</div>
      {% if details %}
      <pre>{{ details }}</pre>
      {% endif %}
      <a class="back" href="/">← Back to upload</a>
    </div>
  </main>
</body>
</html>
